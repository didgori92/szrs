<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Main Page</title>
        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <header>

        </header>

        <main>

            <div class="card">
                <h1>Register With Us</h1>
                <form id="regform" novalidate>
                    <div class="group">
                        <p class="lbl">Username</p>
                        <input type="text" id="usr" placeholder="Enter username">
                        <p class="err" id="usrerr"></p>
                    </div>

                    <div class="group">
                        <p class="lbl">Email</p>
                        <input type="email" id="eml" placeholder="Enter email">
                        <p class="err" id="emlerr"></p>
                    </div>

                    <div class="group">
                        <p class="lbl">Password</p>
                        <input type="password" id="pwd" placeholder="Enter password">
                        <p class="err" id="pwderr"></p>
                    </div>

                    <div class="group">
                        <p class="lbl">Confirm Password</p>
                        <input type="password" id="cpwd" placeholder="Enter password again">
                        <p class="err" id="cpwderr"></p>
                    </div>

                    <button type="submit" class="subbtn">Submit</button>
                </form>
            </div>

        </main>

        <footer>

        </footer>

        <script src="script.js">
            
        </script>
    
    </body>

</html>
