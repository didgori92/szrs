<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Amazon</title>
        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <header>

            <img id="logo" src="amazon.png" alt="Amazon Logo">

        </header>

        <main>
            <div id="box">
                
                <div id="left">

                    <div id="watch">

                        <img id="img" src="watch.png" alt="Smart Watch">

                        <p id="time"></p>
                        
                    </div>

                </div>

                <div id="right">

                    <h1 id="title">FitBit 19 - The Smartest Watch</h1>
                    
                    <p id="desc">
                        Lorem ipsum dolor sit amet consectetur adipisicing elit. Deleniti asperiores
                        adipisci culpa rem? A, tenetur veritatis.
                    </p>

                    <h3 class="sub">Select Color</h3>

                    <div id="cols">

                        <div class="col black"></div>

                        <div class="col red"></div>
                        
                        <div class="col blue"></div>

                        <div class="col purple"></div>

                    </div>

                    <h3 class="sub">Features</h3>

                    <div id="feats">

                        <button id="timebtn" class="btn">Time</button>
                        <button id="heartbtn" class="btn">Heart Rate</button>

                    </div>

                    <button id="buy">BUY NOW</button>

                </div>

            </div>

        </main>

        <footer>

        </footer>

        <script src="script.js"></script>
    </body>
</html>
